set -g default-shell /bin/zsh
set -g status-position bottom
set -g status-style bg=default
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 60
set -g status-interval 1

# Mostra as 3 sessões fixas, destacando a atual
set -g status-right "#{?#{==:#{session_name},main}, #[bg=#5e81ac#,fg=#2e3440] main #[default], #[fg=#4c566a] main }#{?#{==:#{session_name},secondary}, #[bg=#5e81ac#,fg=#2e3440] secondary #[default], #[fg=#4c566a] secondary }#{?#{==:#{session_name},claude}, #[bg=#5e81ac#,fg=#2e3440] claude #[default], #[fg=#4c566a] claude }"

# Atalhos pra trocar de sessão
bind-key M switch-client -t main
bind-key S switch-client -t secondary
bind-key C switch-client -t claude

# Esconde indicador de janela (canto esquerdo)
set -g window-status-current-format ""
set -g window-status-format ""
set -g status-left-length 0

# Navegar entre sessões com Alt + setas
bind-key -n M-Left switch-client -p
bind-key -n M-Right switch-client -n

set -g mouse on