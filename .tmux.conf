set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position bottom
set -g status-style bg=default
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 60
set -g status-interval 1

# Mostra as 3 sessões fixas, destacando a atual
set -g status-right "#{?#{==:#{session_name},main}, #[bg=#84a0c6#,fg=#161821] main #[default], #[fg=#6b7089] main }#{?#{==:#{session_name},secondary}, #[bg=#84a0c6#,fg=#161821] secondary #[default], #[fg=#6b7089] secondary }#{?#{==:#{session_name},third}, #[bg=#84a0c6#,fg=#161821] third #[default], #[fg=#6b7089] third }"

# Atalhos pra trocar de sessão
bind-key M switch-client -t main
bind-key S switch-client -t secondary
bind-key T switch-client -t third

# Esconde indicador de janela (canto esquerdo)
set -g window-status-current-format ""
set -g window-status-format ""

# Navegar entre sessões com Alt + setas
bind-key -n M-Left switch-client -p
bind-key -n M-Right switch-client -n

set -g mouse on

# Permite que programas (ex.: micro) copiem para a área de transferência do Windows
set -g set-clipboard on
