# Alacritty nativo do Windows, usando o Arch no WSL como shell.
# {{WSL_DISTRO}} é substituído pelo install.sh com o nome da sua distro.

[env]
TERM = "xterm-256color"

[general]
import = ["~/AppData/Roaming/alacritty/themes/themes/iceberg.toml"]

[window]
dimensions = { columns = 100, lines = 20 }
dynamic_padding = true
padding.x = 12
padding.y = 12
opacity = 0.95

[font]
size = 10
normal.family = "MesloLGS Nerd Font Mono"
builtin_box_drawing = true

[font.offset]
y = 2

[cursor]
style = { shape = "Underline", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "V", mods = "Control", action = "Paste" },
  # Ctrl+Backspace apaga a palavra anterior (envia ^W)
  { key = "Back", mods = "Control", chars = "\u0017" },
]

[scrolling]
history = 10000
multiplier = 3

[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

[hints]
[[hints.enabled]]
regex = "(https?://|www\\.)[^\\s]+"
command = "explorer.exe"
mouse = { enabled = true, mods = "Control" }

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[terminal]
shell = { program = "wsl.exe", args = ["-d", "{{WSL_DISTRO}}", "--cd", "~", "--", "zsh", "-i", "-c", "~/.tmux-sessions.sh"] }
