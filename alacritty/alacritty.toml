[env]
TERM = "xterm-256color"

[general]
import = ["~/.config/alacritty/themes/themes/nord.toml"]

[window]
dimensions = { columns = 100, lines = 20 }
decorations = "Buttonless"
dynamic_padding = true
padding.x = 12
padding.y = 12
opacity = 0.9
blur = true

[font]
size = 10
normal.family = "MesloLGS Nerd Font Mono"
builtin_box_drawing = true

[font.offset]
y = 2

[cursor]
style = { shape = "Underline", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "V", mods = "Control", action = "Paste" },
]

[scrolling]
history = 10000
multiplier = 3

[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

[hints]
[[hints.enabled]]
regex = "(https?://|www\\.)[^\\s]+"
command = "xdg-open"
mouse = { enabled = true, mods = "Control" }

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[terminal]
shell = { program = "/bin/zsh", args = ["-i", "-c", "/home/paulobarone/.tmux-sessions.sh"] }
